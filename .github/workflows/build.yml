name: Build MovieExplorer

on:
  push:
    branches: [ agentic ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup Visual Studio Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Extract Boost headers
      run: |
        7z x boost\boost_1_60_0.7z -oboost_extracted -y

    - name: Test WinHTTP compile
      shell: cmd
      run: |
        echo #define WIN32_LEAN_AND_MEAN > test_wh.cpp
        echo #define _WIN32_WINNT 0x0600 >> test_wh.cpp
        echo #include ^<sdkddkver.h^> >> test_wh.cpp
        echo #include ^<windows.h^> >> test_wh.cpp
        echo #include ^<winhttp.h^> >> test_wh.cpp
        echo INTERNET_PORT x = INTERNET_DEFAULT_HTTP_PORT; int main() { HINTERNET h = WinHttpOpen(L"",0,0,0,0); return 0; } >> test_wh.cpp
        cl /EHsc test_wh.cpp /link winhttp.lib

    - name: Build Debug|Win32
      run: msbuild MovieExplorer\VS2015\MovieExplorer.vcxproj /p:Configuration=Debug /p:Platform=Win32 /m /verbosity:normal
