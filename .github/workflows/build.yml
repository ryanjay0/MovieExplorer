name: Build MovieExplorer

on:
  push:
    branches: [ agentic ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup Visual Studio Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Build Debug|Win32
      run: msbuild MovieExplorer\VS2015\MovieExplorer.vcxproj /p:Configuration=Debug /p:Platform=Win32 /m /verbosity:normal

    - name: Build Release|Win32
      run: msbuild MovieExplorer\VS2015\MovieExplorer.vcxproj /p:Configuration=Release /p:Platform=Win32 /m /verbosity:normal

    - name: Setup VS Dev Cmd for x64
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build Debug|x64
      run: msbuild MovieExplorer\VS2015\MovieExplorer.vcxproj /p:Configuration=Debug /p:Platform=x64 /m /verbosity:normal

    - name: Build Release|x64
      run: msbuild MovieExplorer\VS2015\MovieExplorer.vcxproj /p:Configuration=Release /p:Platform=x64 /m /verbosity:normal

    - name: Upload Release Win32 exe
      uses: actions/upload-artifact@v4
      with:
        name: MovieExplorer-Release-Win32
        path: MovieExplorer\VS2015\Release\MovieExplorer.exe

    - name: Upload Release x64 exe
      uses: actions/upload-artifact@v4
      with:
        name: MovieExplorer-Release-x64
        path: MovieExplorer\VS2015\x64\Release\MovieExplorer.exe
