name: Build MovieExplorer

on:
  push:
    branches: [ agentic ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup Visual Studio Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Extract Boost headers
      run: |
        7z x boost\boost_1_60_0.7z -oboost_extracted -y

    - name: Test without WIN32_LEAN_AND_MEAN
      shell: cmd
      run: |
        echo #define _WIN32_WINNT 0x0600 > testF.cpp
        echo #include ^<sdkddkver.h^> >> testF.cpp
        echo #include ^<windows.h^> >> testF.cpp
        echo #include ^<winhttp.h^> >> testF.cpp
        echo int x = WINHTTP_ACCESS_TYPE_DEFAULT_PROXY; int main(){return 0;} >> testF.cpp
        cl /EHsc /DWIN32 /D_DEBUG /D_WINDOWS /D_WINHTTPX_ /D_UNICODE /DUNICODE testF.cpp /link winhttp.lib
      continue-on-error: true

    - name: Test with WIN32_LEAN_AND_MEAN but without wininet
      shell: cmd
      run: |
        echo #define _WIN32_WINNT 0x0600 > testG.cpp
        echo #include ^<sdkddkver.h^> >> testG.cpp
        echo #define WIN32_LEAN_AND_MEAN >> testG.cpp
        echo #include ^<windows.h^> >> testG.cpp
        echo #include ^<winhttp.h^> >> testG.cpp
        echo int x = WINHTTP_ACCESS_TYPE_DEFAULT_PROXY; int main(){return 0;} >> testG.cpp
        cl /EHsc /DWIN32 /D_DEBUG /D_WINDOWS /D_WINHTTPX_ /D_UNICODE /DUNICODE testG.cpp /link winhttp.lib
      continue-on-error: true

    - name: Test with WIN32_LEAN_AND_MEAN and wininet
      shell: cmd
      run: |
        echo #define _WIN32_WINNT 0x0600 > testH.cpp
        echo #include ^<sdkddkver.h^> >> testH.cpp
        echo #define WIN32_LEAN_AND_MEAN >> testH.cpp
        echo #include ^<windows.h^> >> testH.cpp
        echo #include ^<wininet.h^> >> testH.cpp
        echo #include ^<winhttp.h^> >> testH.cpp
        echo int x = WINHTTP_ACCESS_TYPE_DEFAULT_PROXY; int main(){return 0;} >> testH.cpp
        cl /EHsc /DWIN32 /D_DEBUG /D_WINDOWS /D_WINHTTPX_ /D_UNICODE /DUNICODE testH.cpp /link winhttp.lib
      continue-on-error: true

    - name: Test just _UNICODE UNICODE (no other defines)
      shell: cmd
      run: |
        echo #define _WIN32_WINNT 0x0600 > testI.cpp
        echo #include ^<sdkddkver.h^> >> testI.cpp
        echo #define WIN32_LEAN_AND_MEAN >> testI.cpp
        echo #include ^<windows.h^> >> testI.cpp
        echo #include ^<winhttp.h^> >> testI.cpp
        echo int x = WINHTTP_ACCESS_TYPE_DEFAULT_PROXY; int main(){return 0;} >> testI.cpp
        cl /EHsc /D_UNICODE /DUNICODE testI.cpp /link winhttp.lib
      continue-on-error: true

    - name: Build Debug|Win32
      run: msbuild MovieExplorer\VS2015\MovieExplorer.vcxproj /p:Configuration=Debug /p:Platform=Win32 /m /verbosity:normal
