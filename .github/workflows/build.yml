name: Build MovieExplorer

on:
  push:
    branches: [ agentic ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup Visual Studio Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Extract Boost headers
      run: |
        7z x boost\boost_1_60_0.7z -oboost_extracted -y
        echo "BOOST_ROOT=$env:GITHUB_WORKSPACE\boost_extracted\boost_1_60_0" >> $env:GITHUB_ENV

    - name: Build Debug|Win32
      run: msbuild MovieExplorer\VS2015\MovieExplorer.vcxproj /p:Configuration=Debug /p:Platform=Win32 /m /verbosity:normal

    - name: Build Debug|x64
      run: msbuild MovieExplorer\VS2015\MovieExplorer.vcxproj /p:Configuration=Debug /p:Platform=x64 /m /verbosity:normal
