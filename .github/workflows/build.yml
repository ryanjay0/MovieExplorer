name: Build MovieExplorer

on:
  push:
    branches: [ agentic ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup Visual Studio Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Extract Boost headers
      run: |
        7z x boost\boost_1_60_0.7z -oboost_extracted -y

    - name: Test with just _WINHTTPX_
      shell: cmd
      run: |
        echo #define _WIN32_WINNT 0x0600 > testJ.cpp
        echo #include ^<sdkddkver.h^> >> testJ.cpp
        echo #define WIN32_LEAN_AND_MEAN >> testJ.cpp
        echo #include ^<windows.h^> >> testJ.cpp
        echo #include ^<winhttp.h^> >> testJ.cpp
        echo int x = WINHTTP_ACCESS_TYPE_DEFAULT_PROXY; int main(){return 0;} >> testJ.cpp
        cl /EHsc /D_WINHTTPX_ testJ.cpp /link winhttp.lib
      continue-on-error: true

    - name: Test with just WIN32
      shell: cmd
      run: |
        echo #define _WIN32_WINNT 0x0600 > testK.cpp
        echo #include ^<sdkddkver.h^> >> testK.cpp
        echo #define WIN32_LEAN_AND_MEAN >> testK.cpp
        echo #include ^<windows.h^> >> testK.cpp
        echo #include ^<winhttp.h^> >> testK.cpp
        echo int x = WINHTTP_ACCESS_TYPE_DEFAULT_PROXY; int main(){return 0;} >> testK.cpp
        cl /EHsc /DWIN32 testK.cpp /link winhttp.lib
      continue-on-error: true

    - name: Test with just _DEBUG
      shell: cmd
      run: |
        echo #define _WIN32_WINNT 0x0600 > testL.cpp
        echo #include ^<sdkddkver.h^> >> testL.cpp
        echo #define WIN32_LEAN_AND_MEAN >> testL.cpp
        echo #include ^<windows.h^> >> testL.cpp
        echo #include ^<winhttp.h^> >> testL.cpp
        echo int x = WINHTTP_ACCESS_TYPE_DEFAULT_PROXY; int main(){return 0;} >> testL.cpp
        cl /EHsc /D_DEBUG testL.cpp /link winhttp.lib
      continue-on-error: true

    - name: Test with just _WINDOWS
      shell: cmd
      run: |
        echo #define _WIN32_WINNT 0x0600 > testM.cpp
        echo #include ^<sdkddkver.h^> >> testM.cpp
        echo #define WIN32_LEAN_AND_MEAN >> testM.cpp
        echo #include ^<windows.h^> >> testM.cpp
        echo #include ^<winhttp.h^> >> testM.cpp
        echo int x = WINHTTP_ACCESS_TYPE_DEFAULT_PROXY; int main(){return 0;} >> testM.cpp
        cl /EHsc /D_WINDOWS testM.cpp /link winhttp.lib
      continue-on-error: true

    - name: Build Debug|Win32
      run: msbuild MovieExplorer\VS2015\MovieExplorer.vcxproj /p:Configuration=Debug /p:Platform=Win32 /m /verbosity:normal
