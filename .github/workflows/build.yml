name: Build MovieExplorer

on:
  push:
    branches: [ agentic ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup Visual Studio Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Extract Boost headers
      run: |
        7z x boost\boost_1_60_0.7z -oboost_extracted -y

    - name: Test with exact MSBuild defines
      shell: cmd
      run: |
        echo #define _WIN32_WINNT 0x0600 > test2.cpp
        echo #include ^<sdkddkver.h^> >> test2.cpp
        echo #define WIN32_LEAN_AND_MEAN >> test2.cpp
        echo #define _CRT_SECURE_NO_WARNINGS >> test2.cpp
        echo #include ^<windows.h^> >> test2.cpp
        echo #include ^<wininet.h^> >> test2.cpp
        echo #include ^<winhttp.h^> >> test2.cpp
        echo INTERNET_PORT x = WINHTTP_ACCESS_TYPE_DEFAULT_PROXY; int main(){return 0;} >> test2.cpp
        cl /EHsc /DWIN32 /D_DEBUG /D_WINDOWS /D_WINHTTPX_ /D_UNICODE /DUNICODE test2.cpp /link winhttp.lib

    - name: Build Debug|Win32
      run: msbuild MovieExplorer\VS2015\MovieExplorer.vcxproj /p:Configuration=Debug /p:Platform=Win32 /m /verbosity:normal
