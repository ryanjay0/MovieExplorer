name: Build MovieExplorer

on:
  push:
    branches: [ agentic ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup Visual Studio Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Extract Boost headers
      run: |
        7z x boost\boost_1_60_0.7z -oboost_extracted -y

    - name: Test A - no extra defines
      shell: cmd
      run: |
        echo #define _WIN32_WINNT 0x0600 > testA.cpp
        echo #include ^<sdkddkver.h^> >> testA.cpp
        echo #include ^<windows.h^> >> testA.cpp
        echo #include ^<winhttp.h^> >> testA.cpp
        echo int x = WINHTTP_ACCESS_TYPE_DEFAULT_PROXY; int main(){return 0;} >> testA.cpp
        cl /EHsc testA.cpp /link winhttp.lib
      continue-on-error: true

    - name: Test B - with _UNICODE UNICODE
      shell: cmd
      run: |
        echo #define _WIN32_WINNT 0x0600 > testB.cpp
        echo #include ^<sdkddkver.h^> >> testB.cpp
        echo #include ^<windows.h^> >> testB.cpp
        echo #include ^<winhttp.h^> >> testB.cpp
        echo int x = WINHTTP_ACCESS_TYPE_DEFAULT_PROXY; int main(){return 0;} >> testB.cpp
        cl /EHsc /D_UNICODE /DUNICODE testB.cpp /link winhttp.lib
      continue-on-error: true

    - name: Test C - with _DEBUG _WINDOWS
      shell: cmd
      run: |
        echo #define _WIN32_WINNT 0x0600 > testC.cpp
        echo #include ^<sdkddkver.h^> >> testC.cpp
        echo #include ^<windows.h^> >> testC.cpp
        echo #include ^<winhttp.h^> >> testC.cpp
        echo int x = WINHTTP_ACCESS_TYPE_DEFAULT_PROXY; int main(){return 0;} >> testC.cpp
        cl /EHsc /D_DEBUG /D_WINDOWS testC.cpp /link winhttp.lib
      continue-on-error: true

    - name: Build Debug|Win32
      run: msbuild MovieExplorer\VS2015\MovieExplorer.vcxproj /p:Configuration=Debug /p:Platform=Win32 /m /verbosity:normal
